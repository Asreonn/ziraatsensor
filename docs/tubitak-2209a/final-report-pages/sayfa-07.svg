  <text class="text" x="95" y="120" text-anchor="start" font-size="30" font-weight="800" fill="#1F2937"><tspan x="95" dy="0">Alarm ve Veri Güncelliği</tspan></text><image href="data:image/svg+xml;base64," x="95" y="230" width="1050" height="575" preserveAspectRatio="xMidYMid meet"/><text class="text" x="95" y="837" text-anchor="start" font-size="13" font-weight="500" fill="#374151"><tspan x="95" dy="0">Şekil 6. Alarm karar modeli. Ölçüm geçerliliği, eşik karşılaştırma, susturma ve olay günlüğü ilişkisi.</tspan></text><image href="data:image/svg+xml;base64," x="95" y="950" width="1050" height="575" preserveAspectRatio="xMidYMid meet"/><text class="text" x="95" y="1557" text-anchor="start" font-size="13" font-weight="500" fill="#374151"><tspan x="95" dy="0">Şekil 7. Veri güncelliği durum modeli. Canlı, bekleniyor ve veri yok durumlarının cihaz çevrimine göre ayrılması.</tspan></text><line x1="95" y1="1620" x2="1145" y2="1620" stroke="#CBD5E1"/><text class="text" x="95" y="1660" text-anchor="start" font-size="13" font-weight="500" fill="#6B7280"><tspan x="95" dy="0">AICO 2209-A Final Rapor Taslağı</tspan></text><text class="text" x="1145" y="1660" text-anchor="end" font-size="13" font-weight="500" fill="#6B7280"><tspan x="1145" dy="0">7</tspan></text>
</svg>